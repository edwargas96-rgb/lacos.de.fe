<!doctype html><html><head><meta charset="utf-8">

<style>
@font-face{font-family:"Fraunces";src:url(fraunces.woff2);font-weight:100 900}
@font-face{font-family:"Nunito Sans";src:url(nunito.woff2);font-weight:200 1000}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1040px;overflow:hidden;background:#0A1A45;position:relative;font-family:'Nunito Sans',sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(55% 90% at 78% 55%,rgba(235,168,35,.38),transparent 70%),radial-gradient(40% 60% at 0% 100%,rgba(235,168,35,.18),transparent 70%)}
.art{position:absolute;right:0;top:0;height:1040px;width:1560px;background:url(encontro-1.webp) center/cover;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 34%,#000 62%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 34%,#000 62%)}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,69,.55),transparent 22%,transparent 70%,rgba(10,26,69,.65))}
.rays{position:absolute;left:-260px;top:-260px;width:900px;height:900px;opacity:.35}
.line{position:absolute;left:90px;bottom:90px;width:140px;height:6px;border-radius:6px;background:#EBA823;display:var(--line,none)}
.logo{position:absolute;left:90px;top:80px;background:#FFF5DB;border-radius:36px;padding:22px 38px;display:none;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.logo img{width:380px;display:block;mix-blend-mode:multiply}
.copy{position:absolute;left:90px;top:430px;width:640px;color:#FFF5DB;display:none}
.copy h1{font-family:'Fraunces',serif;font-weight:800;font-size:70px;line-height:1.05;color:#fff}
.copy h1 span{color:#FFD66B}
.copy p{margin-top:28px;font-size:30px;font-weight:600;color:rgba(255,245,219,.92)}
body.b .logo,body.b .copy{display:block}
body.b{--line:block}
</style></head><body class="VARIANT">
<div class="glow"></div><div class="art"></div><div class="vig"></div>

<div class="logo"><img src="logo.webp" alt=""></div>
<div class="copy"><h1>30 encontros para viver a <span>fé em família</span></h1><p>Um passo de cada vez, em família.</p></div>
<div class="line"></div>
</body></html>
