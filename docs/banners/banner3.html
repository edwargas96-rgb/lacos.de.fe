<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Fraunces";src:url(fraunces.woff2);font-weight:100 900}
@font-face{font-family:"Nunito Sans";src:url(nunito.woff2);font-weight:200 1000}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:480px;overflow:hidden;background:#0A1A45;position:relative;font-family:'Nunito Sans',sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(50% 120% at 75% 50%,rgba(235,168,35,.3),transparent 70%)}
.art{position:absolute;right:0;top:0;width:1250px;height:480px;background:url(encontro-1.webp) 0 -22px/1250px auto no-repeat;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.3) 22%,#000 52%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.3) 22%,#000 52%)}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,69,.35),transparent 25%,transparent 75%,rgba(10,26,69,.45))}
.line{position:absolute;left:0;bottom:0;width:100%;height:6px;background:linear-gradient(90deg,#EBA823,rgba(235,168,35,0) 70%)}
.logo{position:absolute;left:80px;top:60px;background:#FFF5DB;border-radius:26px;padding:16px 28px;display:none;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.logo img{width:270px;display:block;mix-blend-mode:multiply}
.copy{position:absolute;left:80px;top:200px;width:620px;display:none}
.copy h1{font-family:'Fraunces',serif;font-weight:800;font-size:50px;line-height:1.06;color:#fff}
.copy h1 span{color:#FFD66B}
.copy p{margin-top:16px;font-size:24px;font-weight:600;color:rgba(255,245,219,.92)}
body.b .logo,body.b .copy{display:block}
</style></head><body class="VARIANT">
<div class="glow"></div><div class="art"></div><div class="vig"></div><div class="line"></div>
<div class="logo"><img src="logo.webp" alt=""></div>
<div class="copy"><h1>30 encontros para viver a <span>fé em família</span></h1><p>Um passo de cada vez, em família.</p></div>
</body></html>
