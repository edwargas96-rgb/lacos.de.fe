<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Fraunces";src:url(fraunces.woff2);font-weight:100 900}
@font-face{font-family:"Nunito Sans";src:url(nunito.woff2);font-weight:200 1000}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1040px;overflow:hidden;position:relative;font-family:'Nunito Sans',sans-serif;
 background:#0A1A45;
 background-image:radial-gradient(50% 85% at 74% 52%,rgba(255,214,107,.55),rgba(235,168,35,.18) 45%,transparent 72%),radial-gradient(35% 55% at 0% 100%,rgba(235,168,35,.2),transparent 70%)}
.disc{position:absolute;right:230px;top:95px;width:850px;height:850px;border-radius:50%;border:3px solid rgba(255,214,107,.35)}
.disc2{position:absolute;right:130px;top:-5px;width:1050px;height:1050px;border-radius:50%;border:2px solid rgba(255,214,107,.18)}
.phone{position:absolute;right:300px;top:30px;height:990px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.55))}
.hills{position:absolute;left:0;bottom:0;width:1920px;height:150px}
.logo{position:absolute;left:90px;top:80px;background:#FFF5DB;border-radius:36px;padding:22px 38px;display:none;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.logo img{width:380px;display:block;mix-blend-mode:multiply}
.copy{position:absolute;left:90px;top:430px;width:700px;display:none}
.copy h1{font-family:'Fraunces',serif;font-weight:800;font-size:70px;line-height:1.05;color:#fff}
.copy h1 span{color:#FFD66B}
.copy p{margin-top:28px;font-size:30px;font-weight:600;color:rgba(255,245,219,.92)}
body.b .logo,body.b .copy{display:block}
</style></head><body class="VARIANT">
<div class="disc2"></div><div class="disc"></div>
<img class="phone" src="produto.webp" alt="">
<svg class="hills" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 60 Q80 10 160 55 T320 45 T400 60 V100 H0Z" fill="#14295F" opacity=".7"/><path d="M0 80 Q100 40 200 75 T400 70 V100 H0Z" fill="#0A1A45"/></svg>
<div class="logo"><img src="logo.webp" alt=""></div>
<div class="copy"><h1>30 encontros para viver a <span>fé em família</span></h1><p>Um passo de cada vez, em família.</p></div>
</body></html>
